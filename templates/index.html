<!DOCTYPE html>
<html>
<head>
    <title>Cat Viewer</title>

    <style>
        body{
            text-align:center;
            font-family:Arial;
            margin-top:30px;
        }

        img{
            width:400px;
            height:400px;
            object-fit:cover;
            border-radius:10px;
        }

        button{
            margin-top:20px;
            padding:10px 25px;
            font-size:18px;
            cursor:pointer;
        }
    </style>
</head>

<body>

<h1>Cat Viewer</h1>

<img src="{{ url_for('static', filename=image) }}">

<form method="POST">
    <input type="hidden" name="index" value="{{ index }}">
    <br>
    <button type="submit">Next</button>
</form>

</body>
</html>
